<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup Page</title>
    <link rel="stylesheet" href="signup.css">
    
</head>
<body>
    <div class="page-container">
         <div class="signup-heading">
        <h2>Learn to code by watching others</h2>
        <p>see how experienced developers solve problems in real-time. <br>
            Watching scripted tutorials is great, but understanding how  <br> developers think is invaluable.</p>
  
      </div>
        
    <div class="signup-container">
        
      <p class="try">Try it free 7 days than $20/mo. thereafter</p>
      <div class="signup-form">
        <form action="#">
          <input type="text" class="input-field" placeholder="First Name" required>
          <input type="text" class="input-field" placeholder="Last Name" required>
          <input type="email" class="input-field" placeholder="Email Address" required>
          <input type="password" class="input-field" placeholder="Password" required>
          
            <button class="button" type="submit">CLAIM YOUR FREE TRIAL</button>
          
        </form>
        <p class="terms">By clicking the button, you are agreeing to our  <a href="#">Terms and Services</a></p>
           </div>  
             </div>
       
     <script src="signup.js"></script>
</body>
</html>
